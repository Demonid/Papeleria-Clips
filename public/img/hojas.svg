<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
    <rect width="400" height="280" fill="#f5f5f5"/>
    <ellipse cx="200" cy="240" rx="95" ry="12" fill="#e0e0e0"/>
    <!-- Resma de hojas -->
    <polygon points="105,175 200,215 295,175 295,130 200,170 105,130" fill="#eeeeee" stroke="#bdbdbd" stroke-width="2"/>
    <polygon points="105,130 200,90 295,130 200,170" fill="#ffffff" stroke="#bdbdbd" stroke-width="2"/>
