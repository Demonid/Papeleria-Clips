    <line x1="110" y1="142" x2="198" y2="180" stroke="#cfd8dc" stroke-width="2"/>
    <line x1="110" y1="154" x2="198" y2="192" stroke="#cfd8dc" stroke-width="2"/>
    <line x1="110" y1="166" x2="198" y2="204" stroke="#cfd8dc" stroke-width="2"/>
    <line x1="290" y1="142" x2="202" y2="180" stroke="#cfd8dc" stroke-width="2"/>
    <line x1="290" y1="154" x2="202" y2="192" stroke="#cfd8dc" stroke-width="2"/>
    <line x1="290" y1="166" x2="202" y2="204" stroke="#cfd8dc" stroke-width="2"/>
    <!-- Cinta envoltorio azul -->
    <polygon points="145,113 175,100 255,147 225,160" fill="#1e88e5" opacity="0.85"/>
    <polygon points="225,160 255,147 255,192 225,205" fill="#1565c0"/>
    <!-- Hoja suelta arriba -->
    <rect x="165" y="45" width="70" height="90" rx="3" transform="rotate(-10 200 90)" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
    <line x1="175" y1="65" x2="220" y2="57" stroke="#cfd8dc" stroke-width="3" stroke-linecap="round"/>
    <line x1="178" y1="80" x2="223" y2="72" stroke="#cfd8dc" stroke-width="3" stroke-linecap="round"/>
    <line x1="181" y1="95" x2="215" y2="89" stroke="#cfd8dc" stroke-width="3" stroke-linecap="round"/>
  </svg>
